<section>
  <div class="container text-center">
    <div
      class="from-body to-light dark:from-darkmode-body dark:to-darkmode-light rounded-2xl bg-gradient-to-b px-8 py-14 reveal reveal-bottom">
      <h1>{{ T (printf "%s" (lower .Title)) | default .Title | title }}</h1>
      {{ with .Description }}
        <p class="mt-6 text-lg max-w-3xl mx-auto reveal reveal-bottom">{{ . | markdownify }}</p>
      {{ else }}
        {{ partial "components/breadcrumb" (dict "Context" . "Class" "mt-6 reveal reveal-bottom") }}
      {{ end }}
    </div>
  </div>
</section>
